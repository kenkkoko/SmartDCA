    <!-- Forum libs (marked / DOMPurify / highlight.js / KaTeX / EasyMDE) are heavy and

    <script>
        window.__forumLibsPromise = null;
        window.__loadForumLibs = function () {
            if (window.__forumLibsPromise) return window.__forumLibsPromise;
            var css = function (href) {
                var l = document.createElement('link');
                l.rel = 'stylesheet'; l.href = href;
                document.head.appendChild(l);
            };
            var js = function (src) {
                return new Promise(function (resolve, reject) {
                    var s = document.createElement('script');
                    s.src = src; s.onload = resolve; s.onerror = reject;
                    document.head.appendChild(s);
                });
            };
            css('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css');
            css('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css');
            css('https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css');
            window.__forumLibsPromise = Promise.all([
                js('https://cdn.jsdelivr.net/npm/marked@12/marked.min.js'),
                js('https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js'),

                    .then(function () { return js('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js'); }),
            ]);
            return window.__forumLibsPromise;
        };
    </script>

        <style>
    /* ─────────────────────────────────────────────
       Smart DCA · Design tokens (NEW)
       ───────────────────────────────────────────── */
    :root {
        --bg:        #07080c;
        --bg-soft:   #0d0f15;
        --surface:   #12141c;
        --surface-2: #181b25;
        --line:      rgba(255, 255, 255, 0.07);
        --line-2:    rgba(255, 255, 255, 0.12);
        --text:      #ffffff;
        --text-2:    #b8bcc8;
        --text-3:    #6b7080;
        --brand-1:   #3b82f6;
        --brand-2:   #8b5cf6;
        --accent:    #4cc2ff;
        --up:        #00d68f;
        --down:      #ff5b6e;
        --warn:      #f59e0b;
    }

    html, body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg); /* override original slate-950 */
        /* PWA 全螢幕(black-translucent)時內容不被瀏海/狀態列/Home 條蓋住;
           一般瀏覽器中 env() 為 0,完全無影響 */
        padding-top: env(safe-area-inset-top, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* 行動瀏覽器網址列收合時高度會變:dvh 追蹤實際可視高度,取代固定的 100vh */
    @supports (height: 100dvh) {
        .min-h-screen { min-height: 100dvh; }
        .h-screen { height: 100dvh; }
    }

    /* Numeric displays */
    .num {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
    }
    .mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Section eyebrow labels (small caps) */
    .label {
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-3);
        font-weight: 600;
    }

    /* Surfaces */
    .surface  { background: var(--surface); }
    .surface-2{ background: var(--surface-2); }
    .ring-soft{ box-shadow: inset 0 0 0 1px var(--line); }

    /* Glass nav / glass buttons (you liked these) */
    .glass {
        background: rgba(18, 20, 28, 0.55);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-strong {
        background: rgba(10, 11, 16, 0.72);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Brand gradient (logo's blue → violet) */
    .pill-grad {
        background-image: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%);
    }
    .text-grad {
        background-image: linear-gradient(135deg, #5fa8ff 0%, #b78cff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .glow-brand {
        box-shadow:
            0 0 0 1px rgba(139, 92, 246, 0.25),
            0 20px 60px -20px rgba(59, 130, 246, 0.55),
            0 8px 32px -8px rgba(139, 92, 246, 0.45);
    }

    /* Sparkline / chart glows */
    .spark-glow { filter: drop-shadow(0 0 8px rgba(76, 194, 255, 0.55)); }
    .up-glow    { filter: drop-shadow(0 0 8px rgba(0, 214, 143, 0.6)); }
    .down-glow  { filter: drop-shadow(0 0 8px rgba(255, 91, 110, 0.55)); }
    .gauge-glow { filter: drop-shadow(0 0 10px rgba(255, 191, 71, 0.5)); }

    /* Dot grid texture (use on hero cards) */
    .dotgrid {
        background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 18px 18px;
        background-position: -1px -1px;
    }

    /* Up/Down/Neutral pill chips */
    .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
    }
    .chip-up      { background: rgba(0, 214, 143, 0.12);  color: #3ce0a8; }
    .chip-down    { background: rgba(255, 91, 110, 0.12); color: #ff7d8c; }
    .chip-neutral { background: rgba(255, 255, 255, 0.06); color: var(--text-2); }
    .chip-warn    { background: rgba(245, 158, 11, 0.12); color: #fbbf24; }

    /* Scrollbar — switched to new palette */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.10);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.18);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }

    /* Hide scrollbar for nav horizontal scroll on mobile */
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

    /* Fade / zoom animation for dropdowns (keeps original Tailwind animate-in working) */
    @keyframes om-fade-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }
    .animate-in.fade-in.zoom-in-95 { animation: om-fade-in 200ms cubic-bezier(0.16, 1, 0.3, 1); }

    /* Selection */
    ::selection { background: rgba(139, 92, 246, 0.35); color: #fff; }


    /* ────────────────────────────────
       Forum: rendered markdown styling
       (Tailwind preflight resets headings/lists, so we restore them here)
       ──────────────────────────────── */
    .forum-md { color: var(--text-2); line-height: 1.75; }
    .forum-md h1 { font-size: 1.875rem; font-weight: 700; color: #fff; margin: 1.5rem 0 0.75rem; }
    .forum-md h2 { font-size: 1.5rem;   font-weight: 700; color: #fff; margin: 1.25rem 0 0.5rem; border-bottom: 1px solid var(--line); padding-bottom: 0.35rem; }
    .forum-md h3 { font-size: 1.25rem;  font-weight: 700; color: #fff; margin: 1rem 0 0.5rem; }
    .forum-md h4 { font-size: 1.05rem;  font-weight: 700; color: #fff; margin: 0.75rem 0 0.25rem; }
    .forum-md p  { margin: 0.5rem 0; }
    .forum-md ul { list-style: disc;    padding-left: 1.5rem; margin: 0.5rem 0; }
    .forum-md ol { list-style: decimal; padding-left: 1.5rem; margin: 0.5rem 0; }
    .forum-md li { margin: 0.25rem 0; }
    .forum-md a  { color: #c4b5fd; text-decoration: underline; text-decoration-color: rgba(196,181,253,0.3); text-underline-offset: 3px; }
    .forum-md a:hover { color: #ddd6fe; text-decoration-color: rgba(196,181,253,0.8); }
    .forum-md strong { color: #fff; font-weight: 700; }
    .forum-md em { font-style: italic; }
    .forum-md hr { border: none; border-top: 1px solid var(--line); margin: 1.5rem 0; }
    .forum-md blockquote {
        border-left: 3px solid var(--brand-2);
        padding: 0.5rem 0 0.5rem 1rem;
        color: var(--text-2);
        margin: 0.75rem 0;
        background: rgba(139,92,246,0.05);
        border-radius: 0 8px 8px 0;
    }
    /* Inline code */
    .forum-md code:not(pre code) {
        background: rgba(139,92,246,0.12);
        color: #c4b5fd;
        padding: 0.125rem 0.4rem;
        border-radius: 0.35rem;
        font-size: 0.875em;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    /* Code block (highlight.js handles inner coloring) */
    .forum-md pre {
        background: #07080c !important;
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 1rem;
        overflow-x: auto;
        margin: 0.75rem 0;
    }
    .forum-md pre code {
        background: transparent !important;
        padding: 0 !important;
        font-size: 0.875rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .forum-md img {
        max-width: 100%;
        height: auto;
        border-radius: 0.75rem;
        margin: 0.75rem 0;
        border: 1px solid var(--line);
    }
    .forum-md table {
        border-collapse: collapse;
        margin: 0.75rem 0;
        width: 100%;
    }
    .forum-md th, .forum-md td {
        border: 1px solid var(--line);
        padding: 0.5rem 0.75rem;
        text-align: left;
    }
    .forum-md th { background: var(--surface-2); color: #fff; }
    /* KaTeX display math gets some breathing room */
    .forum-md .katex-display { margin: 1rem 0; overflow-x: auto; }

    /* Lightbox fade-in animation */
    @keyframes forum-lightbox-fade {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    /* ────────────────────────────────
       EasyMDE dark theme overrides
       ──────────────────────────────── */
    .EasyMDEContainer .CodeMirror {
        background: #0f172a;
        color: #e2e8f0;
        border-color: #334155;
        min-height: 320px;
    }
    .EasyMDEContainer .CodeMirror-cursor { border-left-color: #e2e8f0; }
    .EasyMDEContainer .CodeMirror-selected { background: #1e40af66 !important; }
    .EasyMDEContainer .editor-toolbar {
        background: #1e293b;
        border-color: #334155;
    }
    .EasyMDEContainer .editor-toolbar button {
        color: #cbd5e1 !important;
    }
    .EasyMDEContainer .editor-toolbar button:hover,
    .EasyMDEContainer .editor-toolbar button.active {
        background: #334155 !important;
        border-color: #475569 !important;
    }
    .EasyMDEContainer .editor-toolbar i.separator {
        border-left-color: #334155;
        border-right-color: #475569;
    }
    .EasyMDEContainer .editor-statusbar { color: #64748b; }
    .EasyMDEContainer .editor-preview,
    .EasyMDEContainer .editor-preview-side {
        background: #0f172a;
        color: #cbd5e1;
        border-color: #334155;
    }
    /* Editor's drop-zone feedback while dragging an image */
    .EasyMDEContainer.CodeMirror.dragging { background: #1e3a8a !important; }

    /* Force dark dropdown option background on all selects (browsers don't inherit) */
    select option, select optgroup {
        background-color: #0e1014 !important;
        color: #ffffff !important;
    }
    select option:checked, select option:hover {
        background-color: #181b25 !important;
    }

    /* ─────────────────────────────────────────────
       Compatibility shim · 把舊的 Tailwind slate-900
       卡片視覺接管到新系統，不用改各個 dashboard 的 JSX
       ───────────────────────────────────────────── */

    .bg-slate-900 {
        background-color: var(--surface) !important;
        border-color: var(--line) !important;
    }
    .bg-slate-800 {
        background-color: var(--surface-2) !important;
    }
    .bg-slate-800\/50, .bg-slate-800\/30 {
        background-color: rgba(255,255,255,0.04) !important;
    }
    .bg-slate-900\/50 {
        background-color: rgba(13,15,21,0.6) !important;
    }

    .border-slate-700, .border-slate-800 {
        border-color: var(--line) !important;
    }
    .border-slate-700\/50, .border-slate-800\/50 {
        border-color: var(--line) !important;
    }

    .bg-indigo-600, .bg-blue-600 {
        background-image: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%) !important;
        background-color: transparent !important;
    }
    .bg-indigo-500, .bg-blue-500 {
        background-image: linear-gradient(135deg, #5fa8ff 0%, #b78cff 100%) !important;
        background-color: transparent !important;
    }
    .hover\:bg-indigo-500:hover, .hover\:bg-blue-500:hover {
        background-image: linear-gradient(135deg, #5fa8ff 0%, #b78cff 100%) !important;
        background-color: transparent !important;
    }

    .text-slate-200 { color: #e8eaef !important; }
    .text-slate-300 { color: var(--text-2) !important; }
    .text-slate-400 { color: var(--text-2) !important; }
    .text-slate-500 { color: var(--text-3) !important; }
    .text-slate-600 { color: rgba(255,255,255,0.18) !important; }

    .rounded-xl  { border-radius: 14px !important; }
    .rounded-2xl { border-radius: 18px !important; }

    .shadow-indigo-500\/20, .shadow-blue-500\/20, .shadow-indigo-900\/20, .shadow-blue-900\/20 {
        box-shadow: 0 8px 24px -8px rgba(139,92,246,0.5) !important;
    }

    /* DCA 建議卡片 (action card) - 強化視覺 */
    .bg-red-900\/30      { background: linear-gradient(135deg, rgba(255,91,110,0.12), rgba(255,91,110,0.04)) !important; }
    .border-red-500\/50  { border-color: rgba(255,91,110,0.4) !important; }
    .text-red-400        { color: #ff7d8c !important; }

    .bg-orange-900\/30   { background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(245,158,11,0.04)) !important; }
    .border-orange-500\/50 { border-color: rgba(245,158,11,0.4) !important; }
    .text-orange-400     { color: #fbbf24 !important; }

    .bg-yellow-900\/30   { background: linear-gradient(135deg, rgba(250,204,21,0.10), rgba(250,204,21,0.04)) !important; }
    .border-yellow-500\/50 { border-color: rgba(250,204,21,0.3) !important; }
    .text-yellow-400     { color: #facc15 !important; }

    .bg-green-900\/30    { background: linear-gradient(135deg, rgba(0,214,143,0.12), rgba(0,214,143,0.04)) !important; }
    .border-green-500\/50 { border-color: rgba(0,214,143,0.4) !important; }
    .text-green-400      { color: #3ce0a8 !important; }
</style>
