                    document.head.appendChild(s);
                });

        <style>
    /* ─────────────────────────────────────────────
       Smart DCA · Factsheet system (light / dark)
       One continuous typeset page: heavy ink rules open sections,
       hairlines divide, one ultramarine accent marks the current action.
       Theme: <html data-theme="light|dark">, set before paint from
       localStorage('theme') or the system preference.
       ───────────────────────────────────────────── */
    :root, :root[data-theme="light"] {
        --paper:     #ffffff;
        --surface:   #f7f7f5;
        --surface-2: #efefec;
        --ink:       #111111;
        --ink-2:     #4a4a4a;
        --ink-3:     #6b6b6b;
        --rule:      #d9d9d9;
        --faint:     #ececec;
        --wash:      rgba(17, 17, 17, 0.04);
        --wash-2:    rgba(17, 17, 17, 0.08);
        --accent:    #1b39c4;
        --accent-ink:#ffffff;
        --accent-sub:#c9d1ff;
        --up:        #13804a;
        --down:      #c62f2f;
        --amber:     #96600c;
        --z0: #c62f2f; --z1: #e39a3b; --z2: #b9b9b9; --z3: #5aa37a; --z4: #13804a;
        color-scheme: light;
    }
    :root[data-theme="dark"] {
        --paper:     #121314;
        --surface:   #1a1b1d;
        --surface-2: #222326;
        --ink:       #f1efea;
        --ink-2:     #bdbab3;
        --ink-3:     #9a968f;
        --rule:      #2f3032;
        --faint:     #252628;
        --wash:      rgba(241, 239, 234, 0.05);
        --wash-2:    rgba(241, 239, 234, 0.09);
        --accent:    #6f8bff;
        --accent-ink:#0b0d1a;
        --accent-sub:#141d4f;
        --up:        #45c07e;
        --down:      #f0655f;
        --amber:     #e7a948;
        --z0: #f0655f; --z1: #e7a948; --z2: #6d6c69; --z3: #6fbf8e; --z4: #45c07e;
        color-scheme: dark;
    }
    :root {
        /* Legacy token names used by inline styles across the app */
        --bg: var(--paper);
        --bg-soft: var(--surface);
        --line: var(--rule);
        --line-2: var(--rule);
        --text: var(--ink);
        --text-2: var(--ink-2);
        --text-3: var(--ink-3);
        --brand-1: var(--accent);
        --brand-2: var(--accent);
        --brand-ink: var(--accent-ink);
        --warn: var(--amber);
        --font: 'Schibsted Grotesk', 'Noto Sans TC', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
        background-color: var(--paper);
        color: var(--ink);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        caret-color: var(--accent);
        accent-color: var(--accent);
    }
    body {
        padding-top: env(safe-area-inset-top, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @supports (height: 100dvh) {
        .min-h-screen { min-height: 100dvh; }
        .h-screen { height: 100dvh; }
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a { text-underline-offset: 3px; }
    ::selection { background: var(--accent); color: var(--accent-ink); }
    input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }

    .num { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font); font-variant-numeric: tabular-nums; }
    .font-mono { font-family: var(--font) !important; font-variant-numeric: tabular-nums; }

    /* Small legend text (kept for existing markup) */
    .label {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-3);
    }

    /* ── Factsheet building blocks ── */
    .fs-section { border-top: 3px solid var(--ink); padding-top: 14px; }
    .fs-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .fs-title { font-size: 22px; font-weight: 900; letter-spacing: -0.01em; color: var(--ink); }
    .fs-title-sm { font-size: 17px; font-weight: 900; color: var(--ink); }
    .fs-rule { border-top: 1px solid var(--rule); }
    .fs-lbl { font-size: 12px; color: var(--ink-3); }
    @media (max-width: 640px) {
        .fs-head { margin-bottom: 12px; gap: 8px 10px; }
        .fs-title { font-size: 18px; }
        .fs-head .fs-toggle { font-size: 13px; gap: 12px; }
    }

    /* Text toggles: underline marks the selected one */
    .fs-toggle { display: inline-flex; gap: 16px; font-size: 14px; }
    .fs-toggle button { color: var(--ink-2); padding: 2px 0; white-space: nowrap; }
    .fs-toggle button:hover { color: var(--ink); }
    .fs-toggle button.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink); }

    /* Outline / solid buttons */
    :where(.fs-btn) { display: inline-flex; }
    .fs-btn {
        align-items: center; justify-content: center; gap: 6px;
        font: 500 14px var(--font);
        color: var(--ink);
        background: transparent;
        border: 1.5px solid var(--ink);
        padding: 6px 14px;
        white-space: nowrap;
        transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
    }
    .fs-btn:hover { background: var(--wash-2); }
    .fs-btn:disabled { color: var(--ink-3); border-color: var(--rule); cursor: not-allowed; background: transparent; }
    .fs-btn.solid { background: var(--ink); color: var(--paper); }
    .fs-btn.solid:hover { background: var(--ink-2); border-color: var(--ink-2); }
    .fs-btn.sm { font-size: 13px; padding: 4px 10px; }
    .fs-btn.icon { padding: 0; width: 36px; height: 36px; }
    @media (max-width: 400px) { .fs-btn.icon { width: 32px; height: 32px; } }

    /* The one accent: current action */
    .fs-action { background: var(--accent); color: var(--accent-ink); padding: 14px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .fs-action .fs-lbl { color: var(--accent-sub); }
    .fs-steps { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--ink); }
    .fs-steps span { font-size: 12px; padding: 8px 4px 0 0; color: var(--ink-3); line-height: 1.35; }
    .fs-steps span.on { color: var(--accent); font-weight: 900; box-shadow: inset 0 3px 0 var(--accent); }

    .fs-chip { font-size: 11px; font-weight: 700; border: 1.5px solid currentColor; padding: 0 5px; line-height: 1.5; display: inline-block; }

    .tick-up { color: var(--up); }
    .tick-down { color: var(--down); }

    /* Former glass / gradient helpers → flat paper */
    .surface  { background: var(--surface); }
    .surface-2{ background: var(--surface-2); }
    .ring-soft{ box-shadow: inset 0 0 0 1px var(--rule); }
    .glass {
        background: var(--paper);
        border: 1px solid var(--rule);
    }
    .glass-strong {
        background: var(--paper);
        border: 1px solid var(--ink);
        box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.35);
    }
    .pill-grad {
        background: var(--ink) !important;
        color: var(--paper) !important;
    }
    .text-grad { color: var(--ink); }
    .glow-brand { box-shadow: none; }
    .spark-glow, .up-glow, .down-glow, .gauge-glow { filter: none; }
    .dotgrid { background-image: none; }

    .chip {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 1px 6px; font-size: 11px; font-weight: 700; line-height: 1.4;
        border: 1.5px solid currentColor; border-radius: 0;
    }
    .chip-up      { color: var(--up); }
    .chip-down    { color: var(--down); }
    .chip-neutral { color: var(--ink-2); }
    .chip-warn    { color: var(--amber); }

    /* Scrollbars */
    * { scrollbar-color: var(--rule) transparent; scrollbar-width: thin; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border: 2px solid var(--paper); }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--rule); }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

    @keyframes om-fade-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .animate-in.fade-in.zoom-in-95 { animation: om-fade-in 200ms var(--ease-out); }

    /* Ticker row: prices sit on hairlines, no cards */
    .fs-tickers:has(.fs-ticker) { gap: 0 !important; flex-wrap: nowrap; border-bottom: 1px solid var(--rule); }
    .fs-tickers:has(.fs-ticker) > div { min-width: 0 !important; }
    .fs-tickers > div + div .fs-ticker { padding-left: 20px; border-left: 1px solid var(--rule); }
    .fs-ticker { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; padding: 12px 0 14px; height: 100%; }
    .fs-ticker-name { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
    .fs-ticker.on .fs-ticker-name { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
    .fs-ticker-price { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
    .fs-ticker-change { font-size: 13px; font-weight: 500; }
    @media (max-width: 640px) {
        .fs-ticker-price { font-size: 19px; }
        .fs-ticker-name, .fs-ticker-price { flex-basis: 100%; }
        .fs-tickers > div + div .fs-ticker { padding-left: 12px; }
    }

    /* Four key figures on hairlines (MACD) */
    .fs-kv { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--rule); }
    .fs-kv > div { padding: 12px 0; min-width: 0; }
    .fs-kv > div + div { padding-left: 16px; border-left: 1px solid var(--rule); }
    @media (max-width: 767px) {
        .fs-kv { grid-template-columns: repeat(2, 1fr); }
        .fs-kv > div:nth-child(3) { padding-left: 0; border-left: 0; }
        .fs-kv > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
    }

    /* Dial needle eases to its value */
    .fs-needle { transition: transform 900ms var(--ease-out); }
    @media (prefers-reduced-motion: reduce) { .fs-needle { transition: none; } }


    /* ────────────────────────────────
       Forum: rendered markdown styling
       (Tailwind preflight resets headings/lists, so we restore them here)
       ──────────────────────────────── */
    .forum-md { color: var(--text-2); line-height: 1.75; }
    .forum-md h1 { font-size: 1.875rem; font-weight: 700; color: var(--ink); margin: 1.5rem 0 0.75rem; }
    .forum-md h2 { font-size: 1.5rem;   font-weight: 700; color: var(--ink); margin: 1.25rem 0 0.5rem; border-bottom: 1px solid var(--line); padding-bottom: 0.35rem; }
    .forum-md h3 { font-size: 1.25rem;  font-weight: 700; color: var(--ink); margin: 1rem 0 0.5rem; }
    .forum-md h4 { font-size: 1.05rem;  font-weight: 700; color: var(--ink); margin: 0.75rem 0 0.25rem; }
    .forum-md p  { margin: 0.5rem 0; }
    .forum-md ul { list-style: disc;    padding-left: 1.5rem; margin: 0.5rem 0; }
    .forum-md ol { list-style: decimal; padding-left: 1.5rem; margin: 0.5rem 0; }
    .forum-md li { margin: 0.25rem 0; }
    .forum-md a  { color: var(--accent); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
    .forum-md a:hover { text-decoration-color: var(--accent); }
    .forum-md strong { color: var(--ink); font-weight: 700; }
    .forum-md em { font-style: italic; }
    .forum-md hr { border: none; border-top: 1px solid var(--line); margin: 1.5rem 0; }
    .forum-md blockquote {
        border-left: 3px solid var(--ink);
        padding: 0.5rem 0 0.5rem 1rem;
        color: var(--text-2);
        margin: 0.75rem 0;
        background: var(--surface);
        border-radius: 0;
    }
    /* Inline code */
    .forum-md code:not(pre code) {
        background: var(--surface-2);
        color: var(--ink);
        padding: 0.125rem 0.4rem;
        border-radius: 0.35rem;
        font-size: 0.875em;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    /* Code block (highlight.js handles inner coloring) */
    .forum-md pre {
        background: var(--surface) !important;
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 1rem;
        overflow-x: auto;
        margin: 0.75rem 0;
    }
    .forum-md pre code {
        background: transparent !important;
        padding: 0 !important;
        font-size: 0.875rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .forum-md img {
        max-width: 100%;
        height: auto;
        border-radius: 0.75rem;
        margin: 0.75rem 0;
        border: 1px solid var(--line);
    }
    .forum-md table {
        border-collapse: collapse;
        margin: 0.75rem 0;
        width: 100%;
    }
    .forum-md th, .forum-md td {
        border: 1px solid var(--line);
        padding: 0.5rem 0.75rem;
        text-align: left;
    }
    .forum-md th { background: var(--surface-2); color: var(--ink); }
    /* KaTeX display math gets some breathing room */
    .forum-md .katex-display { margin: 1rem 0; overflow-x: auto; }

    /* Lightbox fade-in animation */
    @keyframes forum-lightbox-fade {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    /* ────────────────────────────────
       EasyMDE dark theme overrides
       ──────────────────────────────── */
    .EasyMDEContainer .CodeMirror {
        background: var(--paper);
        color: var(--ink);
        border-color: var(--rule);
        min-height: 320px;
    }
    .EasyMDEContainer .CodeMirror-cursor { border-left-color: var(--ink); }
    .EasyMDEContainer .CodeMirror-selected { background: var(--wash-2) !important; }
    .EasyMDEContainer .editor-toolbar {
        background: var(--surface);
        border-color: var(--rule);
    }
    .EasyMDEContainer .editor-toolbar button {
        color: var(--ink-2) !important;
    }
    .EasyMDEContainer .editor-toolbar button:hover,
    .EasyMDEContainer .editor-toolbar button.active {
        background: var(--rule) !important;
        border-color: var(--ink-3) !important;
    }
    .EasyMDEContainer .editor-toolbar i.separator {
        border-left-color: var(--rule);
        border-right-color: var(--ink-3);
    }
    .EasyMDEContainer .editor-statusbar { color: var(--ink-3); }
    .EasyMDEContainer .editor-preview,
    .EasyMDEContainer .editor-preview-side {
        background: var(--paper);
        color: var(--ink-2);
        border-color: var(--rule);
    }
    /* Editor's drop-zone feedback while dragging an image */
    .EasyMDEContainer.CodeMirror.dragging { background: var(--wash-2) !important; }

    /* ─────────────────────────────────────────────
       Compatibility shim · 把舊的深色 Tailwind 類別接管到月報系統的 tokens，
       讓尚未重做的分頁在淺色／深色模式下都可讀。
       ───────────────────────────────────────────── */

    /* Surfaces */
    .bg-slate-950, .bg-gray-950 { background-color: var(--paper) !important; }
    .bg-slate-900, .bg-gray-900 { background-color: var(--paper) !important; border-color: var(--rule) !important; }
    .bg-slate-800, .bg-gray-800, .bg-slate-700, .bg-gray-700 { background-color: var(--surface-2) !important; }

    /* Accent family (old blue / indigo / violet / purple / cyan) → the one accent */
