name: ETF flows

on:
  schedule:
    # 前一個美股交易日的 ETF 流量，各發行商要到台灣時間中午前後才陸續公布齊全
    #（IBIT 常最晚）。公布後多抓幾次，晚到的數字會覆蓋前一次不完整的值：
    # 台灣時間 11:20、13:20、15:20、18:20、22:20（週二到週六，對應美股週一到週五的資料）
    - cron: '20 3,5,7,10,14 * * 2-6'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many latest days to fetch (max 300)'
        required: false
        default: '300'
      backfill:
        description: 'Also load the full history since Jan 2024 from TFTC (keeps existing rows)'
        required: false
        default: 'false'

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install supabase requests
      - name: Fetch ETF flows
        env:
          SOSO_API_KEY: ${{ secrets.SOSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ETF_LIMIT: ${{ github.event.inputs.limit || '30' }}
          ETF_BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
        run: python fetch_etf_flows.py
